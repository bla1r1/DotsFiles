# =============================================================================
# Foot Wayland Terminal Configuration (Tokyo Night)
# =============================================================================

shell=/bin/fish
term=foot
font=JetBrainsMono Nerd Font:size=10.5
font-bold=JetBrainsMono Nerd Font:size=10.5:weight=bold
font-italic=JetBrainsMono Nerd Font:size=10.5:slant=italic
pad=18x18

[environment]
# name=value

[bell]
urgent=yes
notify=no

[scrollback]
lines=10000
multiplier=3.0

[cursor]
style=beam
blink=yes
beam-thickness=1.8

[colors]
alpha=0.82
foreground=c0caf5
background=1a1b26

## Normal / Regular colors
regular0=15161e  # black
regular1=f7768e  # red
regular2=9ece6a  # green
regular3=e0af68  # yellow
regular4=7aa2f7  # blue
regular5=bb9af7  # magenta
regular6=7dcfff  # cyan
regular7=a9b1d6  # white

## Bright colors
bright0=414868   # bright black
bright1=f7768e   # bright red
bright2=9ece6a   # bright green
bright3=e0af68   # bright yellow
bright4=7aa2f7   # bright blue
bright5=bb9af7   # bright magenta
bright6=7dcfff   # bright cyan
bright7=c0caf5   # bright white

## Selection
selection-foreground=c0caf5
selection-background=283457

[csd]
preferred=none
size=0

[key-bindings]
scrollback-up-page=Shift+Page_Up
scrollback-down-page=Shift+Page_Down
clipboard-copy=Control+c
clipboard-paste=Control+v
font-increase=Control+plus Control+equal
font-decrease=Control+minus
font-reset=Control+0
spawn-terminal=Control+Shift+n
