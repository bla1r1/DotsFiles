#############
### INPUT ###
#############
# Docs: https://man.archlinux.org/man/sway-input.5

input type:keyboard {
    xkb_layout "us,ua"
    xkb_options "grp:alt_shift_toggle"
    repeat_delay 240
    repeat_rate 35
}

input type:pointer {
    accel_profile "flat"
    pointer_accel 0
}

# The compositor draws its own pointer and does not read GTK's settings.ini,
# so without this the cursor under Sway stayed the default while GTK apps used
# the theme below. Matches .config/gtk-3.0/settings.ini.
seat * xcursor_theme catppuccin-cursors-mocha 24

input type:touchpad {
    natural_scroll disabled
    tap enabled
}
