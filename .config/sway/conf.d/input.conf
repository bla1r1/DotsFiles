#############
### INPUT ###
#############
# Docs: https://man.archlinux.org/man/sway-input.5

input type:keyboard {
    xkb_layout "us,ua"
    xkb_options "grp:alt_shift_toggle"
    repeat_delay 240
    repeat_rate 35
}

input type:pointer {
    accel_profile "flat"
    pointer_accel 0
}

input type:touchpad {
    natural_scroll disabled
    tap enabled
}
