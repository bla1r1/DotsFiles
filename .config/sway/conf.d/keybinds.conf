###################
### KEYBINDINGS ###
###################

set $mod Mod4
set $lock $HOME/.local/bin/b1air-daemon lock

# ── Core ──────────────────────────────────────────────────────────
bindsym --to-code $mod+t         exec $terminal
bindsym --to-code $mod+q         kill
bindsym --to-code $mod+e         exec $fileManager
bindsym --to-code $mod+space     exec $menu
bindsym --to-code $mod+k         exec $spotlight
bindsym --to-code $mod+slash     exec $spotlight
bindsym --to-code $mod+shift+space exec $spotlight
bindsym --to-code $mod+f         exec firefox
bindsym --to-code $mod+g         exec github-desktop
bindsym --to-code $mod+v         exec b1air-shell toggle clipboard
bindsym --to-code $mod+period    exec b1air-shell toggle emoji
bindsym --to-code $mod+shift+c   exec $HOME/.local/bin/b1air-daemon color-picker
bindsym --to-code $mod+s         exec steam
bindsym --to-code $mod+d         exec discord
bindsym --to-code $mod+w         exec b1air-shell open settings wallpaper
bindsym --to-code $mod+z         exec b1air-shell toggle zones
bindsym --to-code $mod+p         exec $HOME/.local/bin/b1air-daemon pip
bindsym --to-code $mod+shift+d   exec b1air-shell toggle shelf
bindsym --to-code $mod+shift+o   exec $HOME/.local/bin/b1air-daemon ocr
bindsym --to-code $mod+shift+q   exec $HOME/.local/bin/b1air-daemon qr-scan
bindsym --to-code $mod+shift+a   exec $HOME/.local/bin/b1air-daemon audio-switch
bindsym --to-code $mod+Mod1+r    exec $HOME/.local/bin/b1air-daemon record-gif
bindsym --to-code $mod+shift+v   exec $HOME/.local/bin/b1air-daemon voice-memo
bindsym --to-code $mod+Escape    exec $HOME/.local/bin/b1air-daemon force-quit

# ── Alt+Tab ───────────────────────────────────────────────────────
# Each Tab press while Alt is held advances the on-screen switcher; releasing
# Alt confirms and focuses the selected window. A single toggle bind cannot
# do this — the second press would close the popup instead of cycling.
bindsym --to-code Mod1+Tab       exec b1air-shell switcher-advance
bindsym --to-code --release Mod1 exec b1air-shell switcher-confirm

# Scripts
# b1air-settings the standalone binary can never load its own QML (it
# imports Services, which needs the running quickshell process) — these open
# the in-shell settings panel instead, same as everything else in this file.
bindsym --to-code $mod+shift+s   exec b1air-shell toggle settings
bindsym --to-code $mod+h         exec b1air-shell open settings about
bindsym --to-code $mod+c         exec b1air-shell toggle control
bindsym --to-code $mod+shift+n   exec b1air-shell toggle notifications
bindsym --to-code $mod+b         exec b1air-shell toggle battery
bindsym --to-code $mod+n         exec b1air-shell toggle network
bindsym --to-code $mod+m         exec b1air-shell toggle monitors
bindsym --to-code $mod+shift+m   exec b1air-shell toggle ruler
bindsym --to-code $mod+shift+t   exec b1air-shell toggle focustime
bindsym --to-code $mod+shift+k   exec b1air-shell toggle keyboard

# ── Layout ────────────────────────────────────────────────────────
bindsym --to-code $mod+ctrl+space floating toggle
bindsym --to-code $mod+shift+f   exec $HOME/.local/bin/b1air-daemon fullscreen-toggle
bindsym --to-code $mod+minus     exec $HOME/.local/bin/b1air-daemon window minimize
bindsym --to-code $mod+shift+minus exec $HOME/.local/bin/b1air-daemon window restore
bindsym --to-code $mod+ctrl+f    fullscreen toggle global
bindsym --to-code $mod+shift+g   exec $HOME/.local/bin/b1air-daemon game-mode toggle

# Split direction
bindsym --to-code $mod+shift+i   split toggle
bindsym --to-code $mod+j         layout toggle split

# ── Focus (arrow keys) ────────────────────────────────────────────
bindsym --to-code $mod+Left      focus left
bindsym --to-code $mod+Right     focus right
bindsym --to-code $mod+Up        focus up
bindsym --to-code $mod+Down      focus down

# ── Move windows (Ctrl+arrows) ────────────────────────────────────
bindsym --to-code $mod+ctrl+Left  move left
bindsym --to-code $mod+ctrl+Right move right
bindsym --to-code $mod+ctrl+Up    move up
bindsym --to-code $mod+ctrl+Down  move down

# ── Resize windows (Shift+arrows) ─────────────────────────────────
bindsym --to-code $mod+shift+Left  resize shrink width  50px
bindsym --to-code $mod+shift+Right resize grow   width  50px
bindsym --to-code $mod+shift+Up    resize shrink height 50px
bindsym --to-code $mod+shift+Down  resize grow   height 50px

# ── Workspaces ────────────────────────────────────────────────────
bindsym --to-code $mod+1  workspace number 1
bindsym --to-code $mod+2  workspace number 2
bindsym --to-code $mod+3  workspace number 3
bindsym --to-code $mod+4  workspace number 4
bindsym --to-code $mod+5  workspace number 5
bindsym --to-code $mod+6  workspace number 6
bindsym --to-code $mod+7  workspace number 7
bindsym --to-code $mod+8  workspace number 8
bindsym --to-code $mod+9  workspace number 9
bindsym --to-code $mod+0  workspace number 10

bindsym --to-code $mod+shift+1  move container to workspace number 1
bindsym --to-code $mod+shift+2  move container to workspace number 2
bindsym --to-code $mod+shift+3  move container to workspace number 3
bindsym --to-code $mod+shift+4  move container to workspace number 4
bindsym --to-code $mod+shift+5  move container to workspace number 5
bindsym --to-code $mod+shift+6  move container to workspace number 6
bindsym --to-code $mod+shift+7  move container to workspace number 7
bindsym --to-code $mod+shift+8  move container to workspace number 8
bindsym --to-code $mod+shift+9  move container to workspace number 9
bindsym --to-code $mod+shift+0  move container to workspace number 10

# Scroll through workspaces
bindsym --to-code --whole-window $mod+button4 workspace next
bindsym --to-code --whole-window $mod+button5 workspace prev

# Scratchpad
bindsym --to-code $mod+ctrl+s       scratchpad show
bindsym --to-code $mod+ctrl+shift+s move scratchpad

# ── Mouse: move / resize floating ─────────────────────────────────
floating_modifier $mod normal

# ── Screenshots ───────────────────────────────────────────────────
# Print opens the interactive selection/annotate/record overlay
# (ScreenshotOverlay.qml — built, wired to no keybind until now); shift+Print
# is the same overlay in edit mode. Full/window stay instant: no need for an
# interactive selector when the target is the whole screen or one window.
bindsym --to-code Print                  exec $HOME/.local/bin/b1air-daemon screenshot select
bindsym --to-code shift+Print            exec $HOME/.local/bin/b1air-daemon screenshot select --edit
bindsym --to-code $mod+Print             exec $HOME/.local/bin/b1air-daemon screenshot full
bindsym --to-code $mod+shift+Print       exec $HOME/.local/bin/b1air-daemon screenshot window

# ── Screen lock ───────────────────────────────────────────────────
bindsym --to-code ctrl+alt+l exec $lock

# Lock the instant the lid closes, not whenever logind gets around to
# suspending — a lid-close suspend can take a moment (or get cancelled
# entirely by a quick reopen) and locking is what actually matters, every
# time, even for a one-second close. lock_session_async() no-ops if a lock
# screen from swayidle's own before-sleep hook is already up.
bindswitch --reload lid:on exec $lock

# ── Power & Session Menu ──────────────────────────────────────────
bindsym --to-code $mod+shift+e exec b1air-shell toggle session

# ── Microphone ──
bindsym --to-code --locked XF86AudioMicMute exec $HOME/.local/bin/b1air-daemon mic toggle

# ── Screen brightness ─────────────────────────────────────────────
bindsym --locked XF86MonBrightnessUp   exec $HOME/.local/bin/b1air-daemon brightness up 5
bindsym --locked XF86MonBrightnessDown exec $HOME/.local/bin/b1air-daemon brightness down 5

# ── Keyboard backlight (T2 Mac) ───────────────────────────────────
bindsym --to-code --locked XF86KbdBrightnessUp   exec $HOME/.local/bin/b1air-daemon kbd-backlight up
bindsym --to-code --locked XF86KbdBrightnessDown exec $HOME/.local/bin/b1air-daemon kbd-backlight down

# ── Volume ────────────────────────────────────────────────────────
bindsym --locked XF86AudioRaiseVolume exec $HOME/.local/bin/b1air-daemon volume up
bindsym --locked XF86AudioLowerVolume exec $HOME/.local/bin/b1air-daemon volume down
bindsym --locked XF86AudioMute        exec $HOME/.local/bin/b1air-daemon volume mute

# ── Media playback ────────────────────────────────────────────────
bindsym --locked XF86AudioPlay  exec playerctl play-pause
bindsym --locked XF86AudioPause exec playerctl play-pause
bindsym --locked XF86AudioNext  exec playerctl next
bindsym --locked XF86AudioPrev  exec playerctl previous
