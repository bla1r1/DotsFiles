#################
### AUTOSTART ###
#################

# Single native C++20 Desktop Session Manager, Autotiling, Shell & Integrated TopBar
# $HOME/.local/bin, like the 26 references in keybinds.conf — not
# /usr/local/bin. `make install` always installs to ~/.local/bin; the
# /usr/local/bin copy is best-effort in install.sh (`sudo install … 2>/dev/null`
# with a fallback), so on a machine where that sudo did not happen this one line
# — the one that starts the whole session core — pointed at a file that is not
# there, while every keybind kept working from the other path.
exec $HOME/.local/bin/b1air-daemon session

# SPICE clipboard/resolution sync — Sway doesn't run XDG autostart entries
# like GNOME/KDE do, so this must be launched explicitly. No-op on bare metal
# or non-SPICE VMs (virtio channel just won't exist).
exec [ -e /dev/virtio-ports/com.redhat.spice.0 ] && spice-vdagent
