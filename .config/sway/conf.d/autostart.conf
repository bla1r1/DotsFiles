#################
### AUTOSTART ###
#################

# Single native C++20 Desktop Session Manager, Autotiling, Shell & Integrated TopBar
exec /usr/local/bin/b1air-daemon session

# SPICE clipboard/resolution sync — Sway doesn't run XDG autostart entries
# like GNOME/KDE do, so this must be launched explicitly. No-op on bare metal
# or non-SPICE VMs (virtio channel just won't exist).
exec [ -e /dev/virtio-ports/com.redhat.spice.0 ] && spice-vdagent
