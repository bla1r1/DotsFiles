# =============================================================================
# Kitty Terminal Emulator Configuration
# =============================================================================

# ── Fonts ────────────────────────────────────────────────────────────────────
font_family      JetBrainsMono Nerd Font
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        10.5

# ── Window Layout & Appearance ───────────────────────────────────────────────
window_padding_width 18
hide_window_decorations yes
confirm_os_window_close 0
background_opacity 0.82
background_blur 20
dynamic_background_opacity yes

# ── Cursor & Animation ───────────────────────────────────────────────────────
cursor_shape beam
cursor_beam_thickness 1.8
cursor_blink_interval 0.5
cursor_trail 1
cursor_trail_decay 0.1 0.4
cursor_trail_start_threshold 2

# ── Scrollback Buffer ────────────────────────────────────────────────────────
scrollback_lines 10000
scrollback_pager_history_size 20
wheel_scroll_multiplier 3.0

# ── Tabs & Powerline ─────────────────────────────────────────────────────────
tab_bar_edge top
tab_bar_style powerline
tab_powerline_style slanted
tab_title_template "{index}: {title}"
active_tab_font_style bold

# ── Splits & Layouts ─────────────────────────────────────────────────────────
enabled_layouts splits,stack,tall,fat
allow_remote_control yes

# ── Keybindings ──────────────────────────────────────────────────────────────
# Clipboard
map ctrl+c copy_to_clipboard
map ctrl+v paste_from_clipboard
map shift+insert paste_from_clipboard

# Tabs
map ctrl+shift+t new_tab
map ctrl+shift+w close_tab
map ctrl+shift+right next_tab
map ctrl+shift+left previous_tab
map ctrl+shift+. move_tab_forward
map ctrl+shift+, move_tab_backward

# Splits
map ctrl+shift+enter launch --location=split
map ctrl+shift+d launch --location=vsplit
map ctrl+shift+s launch --location=hsplit
map ctrl+shift+h neighboring_window left
map ctrl+shift+l neighboring_window right
map ctrl+shift+k neighboring_window up
map ctrl+shift+j neighboring_window down

# Font Size
map ctrl+equal change_font_size all +1.0
map ctrl+plus change_font_size all +1.0
map ctrl+minus change_font_size all -1.0
map ctrl+0 change_font_size all 0

# ── Shell & Active Theme ─────────────────────────────────────────────────────
shell .
include themes/tokyo-night.conf
