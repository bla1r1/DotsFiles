# Starship Prompt Configuration (Tokyo Night Theme)
# https://starship.rs

format = """
$os\
$directory\
$git_branch\
$git_status\
$nodejs\
$rust\
$golang\
$python\
$docker_context\
$fill\
$cmd_duration\
$time\
$line_break\
$character"""

# Move the rest of the prompt to the right
[fill]
symbol = " "

# OS Icon
[os]
disabled = false
style = "bold #7aa2f7"

[os.symbols]
Arch = "󰣇 "
Ubuntu = "󰕈 "
Debian = "󰣚 "
Fedora = "󰣛 "
Linux = "󰌽 "
Macos = "󰀵 "

# Directory
[directory]
style = "bold #7dcfff"
format = "[$path]($style) "
truncation_length = 3
truncation_symbol = "…/"

# Git
[git_branch]
symbol = " "
style = "bold #bb9af7"
format = "on [$symbol$branch]($style) "

[git_status]
style = "bold #f7768e"
format = "([$all_status$ahead_behind]($style) )"
conflicted = "󰞇 "
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"
untracked = "󰋗 "
stashed = " "
modified = " "
staged = "󰄬 "
renamed = "󰁔 "
deleted = " "

# Programming Languages
[nodejs]
symbol = "󰏤 "
style = "bold #9ece6a"
format = "via [$symbol($version )]($style)"

[rust]
symbol = " "
style = "bold #ff9e64"
format = "via [$symbol($version )]($style)"

[golang]
symbol = "󰟓 "
style = "bold #7dcfff"
format = "via [$symbol($version )]($style)"

[python]
symbol = "󰌠 "
style = "bold #e0af68"
format = "via [${symbol}${pyenv_prefix}(${version} )(\\($virtualenv\\) )]($style)"

[docker_context]
symbol = "󰡨 "
style = "bold #7aa2f7"
format = "via [$symbol$context]($style) "

# Command Duration
[cmd_duration]
min_time = 2_000
style = "bold #e0af68"
format = "took [$duration]($style) "

# Time
[time]
disabled = false
time_format = "%R"
style = "bold #565f89"
format = "at [$time]($style)"

# Prompt Characters
[character]
success_symbol = "[❯](bold #7aa2f7)"
error_symbol = "[❯](bold #f7768e)"
vimcmd_symbol = "[❮](bold #9ece6a)"
